name: TWRP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. Checkout do repositório
    - name: Checkout
      uses: actions/checkout@v4

    # 2. Dependências básicas
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git wget curl bc build-essential python3

    # 3. Instalar repo tool
    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod +x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    # 4. Inicializar TWRP source
    - name: Init TWRP
      run: |
        mkdir twrp
        cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1

    # 5. Sync otimizado (mais rápido e leve)
    - name: Sync source
      run: |
        cd twrp
        repo sync -j4 --current-branch --no-tags

    # 6. Adicionar device tree
    - name: Add device tree
      run: |
        mkdir -p twrp/device/motorola
        cp -r device/motorola/cancunf twrp/device/motorola/

    # 7. Preparar ambiente de build
    - name: Fix build environment
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        export SKIP_ABI_CHECKS=true

    # 8. Build do recovery
    - name: Build recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_cancunf-eng
        export ALLOW_MISSING_DEPENDENCIES=true
        export SKIP_ABI_CHECKS=true
        mka recoveryimage || true

    # 9. 🔍 DEBUG COMPLETO (achar qualquer output gerado)
    - name: Find build outputs
      run: |
        echo "=== SEARCHING GENERATED FILES ==="
        find twrp/out -type f \( -name "*.img" -o -name "*.zip" \) || true

    # 10. 📦 Upload total (sem depender de caminho fixo)
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-output
        path: twrp/out/
