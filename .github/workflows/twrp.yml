name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libncurses5-dev x11proto-core-dev \
          libx11-dev libgl1-mesa-dev g++-multilib gcc-multilib \
          lib32z1-dev liblz4-tool libssl-dev bc ccache python3 repo openjdk-8-jdk

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init TWRP source
        run: |
          mkdir twrp
          cd twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1
          repo sync -j2

      - name: Clone device tree
        run: |
          cd twrp
          git clone https://github.com/Herick12/android_device_motorola_cancunf.git device/motorola/cancunf

      - name: Build recovery
        run: |
          cd twrp
          source build/envsetup.sh
          lunch twrp_cancunf-eng
          mka recoveryimage

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: recovery
          path: twrp/out/target/product/cancunf/recovery.img
