name: TWRP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    # 1. Baixar seu repositório
    - name: Checkout
      uses: actions/checkout@v4

    # 2. Dependências
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git wget curl bc build-essential python3

    # 3. Instalar repo
    - name: Install repo tool
      run: |
        mkdir -p $HOME/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > $HOME/bin/repo
        chmod +x $HOME/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    # 4. Inicializar TWRP
    - name: Init TWRP
      run: |
        mkdir twrp
        cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1

    # 5. Sync do source
    - name: Sync source
      run: |
        cd twrp
        repo sync -j2

    # 6. 🔥 AQUI ESTÁ A CORREÇÃO PRINCIPAL (SEU ERRO)
    - name: Add device tree
      run: |
        mkdir -p twrp/device/motorola
        cp -r device/motorola/cancunf twrp/device/motorola/

    # 7. Build do TWRP
    - name: Build recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_cancunf-eng
        mka recoveryimage

    # 8. Upload do recovery
    - name: Upload recovery
      uses: actions/upload-artifact@v4
      with:
        name: recovery
        path: twrp/out/target/product/*/recovery.img
